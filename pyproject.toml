[project]
name = "ai-shit"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "boto3>=1.42.74",
  "discord>=2.3.2",
  "langchain>=1.2.13",
  "langchain-aws>=1.4.1",
]

[dependency-groups]
dev = [
  "cfn-lint>=1.54.0",
  "isort>=8.0.1",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "yamllint>=1.38.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py314"

[project.scripts]
discord-bot = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
